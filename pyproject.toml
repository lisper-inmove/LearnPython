[project]
name = "learnpython"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "inmove", email = "lisper.inmove@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
learnpython = "learnpython:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=learnpython --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
